# Every key is namespaced under `iam.` so the bundle can never collide with a
# project's own catalogue. A project overrides any of them by declaring the
# same key in its own translations/ — application catalogues win over bundles.
iam:
    menu:
        root: Identity

    user:
        index: Users
        email: Email
        password: Password
        password_help: Leave blank to keep the current password
        first_name: First name
        last_name: Last name
        roles: Roles
        status: Status
        # `status_active`, not `status.active`: `iam.user.status` is itself a
        # label, and a key cannot be both a string and a parent node.
        status_active: Active
        status_suspended: Suspended
        status_revoked: Revoked

    role:
        index: Roles
        label: Label
        name: Technical name
        name_help: "Lowercase and underscores (project_manager). Set at creation: users carry it."
        name_format: "Lowercase letters, digits and underscores, starting with a letter."
        permissions: Permissions

    agent:
        index: Agents
        name: Name
        description: Description
        description_help: "What it is for, who runs it (\"Security watch, client repositories' CI\")."
        roles: Roles
        status: Status

    api_token:
        index: API tokens
        id: Id
        agent: Agent
        label: Label
        label_help: "Where it will be used (\"lapsa CI\"), to know which one to revoke."
        lifetime: Lifetime
        lifetime_30: 30 days
        lifetime_90: 90 days
        lifetime_180: 180 days
        lifetime_365: 1 year
        issued_at: Issued
        expires_at: Expires
        last_used_at: Last used
        state: State
        state_active: Active
        state_expiring: Expiring soon
        state_expired: Expired
        state_revoked: Revoked
        revoke: Revoke

    activity:
        role_defined: "Role “%role%” defined"
        role_permissions_changed: "A role's permissions changed"
        agent_created: "Agent “%agent%” created"
        agent_roles_changed: "An agent's roles changed"
        api_token_issued: "Token “%token%” issued"
        api_token_revoked: "Token revoked"

    audit:
        index: Audit log
        event_type: Event
        user_id: User (id)
        payload: Details (JSON)
        occurred_at: Occurred at

    security:
        account_suspended: Your account is suspended. Contact an administrator.
        account_revoked: Your account has been revoked.
        account_inactive: Your account is not active.
